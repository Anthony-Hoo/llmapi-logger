name: Build and publish image

# Pushes to the default branch publish a pre-release image (edge). Pushing a
# semver tag publishes the release image and moves :latest. Pull requests build
# and test only, so an untrusted fork can never publish.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: internal/web/frontend/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: internal/web/frontend
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        working-directory: internal/web/frontend
        run: pnpm test

      # The build output is not committed, so this also populates
      # internal/web/dist for the Go embed and lets the Go tests assert the
      # served UI shell instead of skipping it.
      - name: Build frontend
        working-directory: internal/web/frontend
        run: pnpm build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Untagged pushes land on :edge and a sha tag only. A semver tag adds
          # the version tags, and :latest moves only for a real release.
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize published tags
        run: |
          {
            if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "### Released \`${{ github.ref_name }}\`"
            else
              echo "### Pre-release build (no version tag)"
              echo
              echo "\`:latest\` was not moved. Push a \`vX.Y.Z\` tag to cut a release."
            fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
