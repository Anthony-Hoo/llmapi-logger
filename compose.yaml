services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - audit-proxy
      - newapi
    networks:
      - backend

  audit-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmapi-logger:local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["--config", "/etc/audit-proxy/config.yaml"]
    ports:
      - "127.0.0.1:8081:8081"
    expose:
      - "8080"
    volumes:
      - audit-data:/data
      - ./configs/audit-proxy.docker.yaml:/etc/audit-proxy/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_proxy
      POSTGRES_USER: audit_proxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD and the matching database_url in the private proxy config}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_proxy -d audit_proxy"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  newapi:
    image: calciumion/new-api:latest
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - newapi-data:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  audit-data:
  newapi-data:
  postgres-data:
