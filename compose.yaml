services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./configs/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - audit-proxy
      - newapi
    networks:
      - backend

  audit-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: llmapi-logger:local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["--config", "/etc/audit-proxy/config.yaml"]
    ports:
      - "127.0.0.1:8081:8081"
    expose:
      - "8080"
    volumes:
      - audit-data:/data
      # Local staging of body content beyond the memory budget
      # (audit.staging.dir, required: without a usable directory the proxy
      # runs without audit). Its own volume: never the key's /data, never
      # the read-only root or the tmpfs /tmp. doc/deployment/README.md 3.2.
      - audit-staging:/staging
      - ./configs/audit-proxy.docker.yaml:/etc/audit-proxy/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # Starting values for one machine with about 8 GB of memory, not measured
    # for this project. What each one does and how to size it:
    # doc/deployment/postgresql-migration.md, section on database parameters.
    command:
      - postgres
      - -c
      - shared_buffers=${LLMAPI_PG_SHARED_BUFFERS:-1GB}
      - -c
      - maintenance_work_mem=${LLMAPI_PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_wal_size=${LLMAPI_PG_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_timeout=${LLMAPI_PG_CHECKPOINT_TIMEOUT:-15min}
      - -c
      - wal_compression=${LLMAPI_PG_WAL_COMPRESSION:-lz4}
      - -c
      - autovacuum_vacuum_scale_factor=${LLMAPI_PG_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}
    # Parallel queries and parallel VACUUM allocate in /dev/shm, which a
    # container caps at 64 MB by default.
    shm_size: 256mb
    # A fast shutdown writes every dirty buffer in a final checkpoint; give it
    # time instead of being killed and replaying WAL on the next start.
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: audit_proxy
      POSTGRES_USER: audit_proxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD and the matching database_url in the private proxy config}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_proxy -d audit_proxy"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  newapi:
    image: calciumion/new-api:latest
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - newapi-data:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  audit-data:
  audit-staging:
  newapi-data:
  postgres-data:
