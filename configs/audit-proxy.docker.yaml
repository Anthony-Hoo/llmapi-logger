listen: 0.0.0.0:8080
admin_listen: 0.0.0.0:8081
newapi:
  url: http://newapi:3000
  # Podman/WSL host-network example for a Windows loopback proxy:
  # proxy_url: http://127.0.0.1:7897
  proxy_url: ""
  response_header_timeout_seconds: 300
  preserve_host: false
  # Optional NewAPI administrator credential used only for read-only global
  # user and request-log queries. Set both fields or leave both empty/zero.
  access_token: ""
  user_id: 0
mode: available
database_url: "postgresql://audit_proxy:REPLACE_WITH_DATABASE_PASSWORD@postgres:5432/audit_proxy?sslmode=disable"
key_path: /data/audit.key
admin_token: "replace-with-a-random-token"
# Let NewAPI users sign in with their own API key to audit only their own
# traffic. Verified against newapi.url; no extra credential is stored.
developer_login:
  enabled: false
shutdown_timeout_seconds: 30
retention_days: 30
# Cost comes from NewAPI's actual billing (needs newapi.access_token/user_id).
# The optional vocabulary file must exist inside the container when set,
# e.g. vocabulary_file: /config/vocabulary.yaml
insights:
  enabled: true
  vocabulary_file: ""
  # Optional per-model context-window overrides in tokens.
  context_windows: {}
# Audit capture; see audit-proxy.example.yaml. staging.dir is required and is
# the audit-staging volume of compose.yaml.
audit:
  commit_retries: 3
  memory:
    stage_bytes: 8388608
    global_bytes: 268435456
  staging:
    dir: /staging
    max_bytes: 4294967296
# Cold archive (doc/features/26-cold-archive.md); see audit-proxy.example.yaml.
# Off by default. This version only exports: with a mode other than off,
# retention stops deleting and the hot database keeps growing. compose.yaml
# mounts the audit-archive volume at /archive; the image creates it owned by
# the container user (65532) with mode 0700. A host directory mounted there
# instead must have the same owner and mode.
# archive:
#   mode: "off"
#   dir: /archive
#   encrypt: true
#   run_at: "03:00"
#   timezone: ""
#   segment_max_bytes: 268435456
#   conversation_min_turns: 16
#   conversation_min_bytes: 16777216
#   pass_audits: 5000
#   run_deadline_minutes: 240
#   verify_sample: 0.05

interceptors:
  require-client-credential:
    type: require_credential

routes:
  - {id: openai-chat-completions, method: POST, path: /v1/chat/completions, match: exact, parser: openai.chat_completions, interceptors: [require-client-credential]}
  - {id: openai-completions, method: POST, path: /v1/completions, match: exact, parser: openai.completions, interceptors: [require-client-credential]}
  - {id: openai-responses, method: POST, path: /v1/responses, match: exact, parser: openai.responses, interceptors: [require-client-credential]}
  - {id: openai-responses-compact, method: POST, path: /v1/responses/compact, match: exact, parser: openai.responses_compact, interceptors: [require-client-credential]}
  - {id: anthropic-messages, method: POST, path: /v1/messages, match: exact, parser: anthropic.messages, interceptors: [require-client-credential]}
  - {id: gemini-generate-content, method: POST, path: "/v1beta/models/{model}:generateContent", match: template, parser: gemini.generate_content, interceptors: [require-client-credential]}
  - {id: gemini-stream-generate-content, method: POST, path: "/v1beta/models/{model}:streamGenerateContent", match: template, parser: gemini.stream_generate_content, interceptors: [require-client-credential]}
