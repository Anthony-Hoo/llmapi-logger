# Personal host example. Keep this file readable only by the deployment user
# after replacing admin_token.
listen: 127.0.0.1:8080
admin_listen: 127.0.0.1:8081
newapi:
  url: http://127.0.0.1:3000
  # Optional explicit HTTP(S) forward proxy. Empty means direct;
  # HTTP_PROXY/HTTPS_PROXY/NO_PROXY environment variables are not used.
  proxy_url: ""
  # Time allowed for NewAPI to produce response headers / the first stream
  # byte. Increase this above NewAPI's own long-running response timeout.
  response_header_timeout_seconds: 300
  # Keep the client-facing Host when NewAPI must observe the original domain.
  preserve_host: false
  # Optional NewAPI administrator credential used only for read-only global
  # user and request-log queries. Set both fields or leave both empty/zero.
  access_token: ""
  user_id: 0
mode: available
database_url: "postgresql://audit_proxy:REPLACE_WITH_DATABASE_PASSWORD@127.0.0.1:5432/audit_proxy?sslmode=disable"
key_path: ./data/audit.key
admin_token: "replace-with-a-random-token"
# Second management identity. When enabled, a NewAPI user can sign in with their
# own API key and read only the audits that key produced; policy-blocked records
# stay administrator-only. The key is verified against newapi.url and is never
# stored or logged, so no additional credential is needed here.
developer_login:
  enabled: false
shutdown_timeout_seconds: 30
retention_days: 30
# Derived context and usage analysis computed by the asynchronous parser.
# Cost is NewAPI's actual billing and needs newapi.access_token/user_id; the
# old pricing_file setting is deprecated and ignored. The optional vocabulary
# file must already exist when set; keep it outside this repository, e.g.
# vocabulary_file: /etc/audit-proxy/vocabulary.yaml
insights:
  enabled: true
  vocabulary_file: ""
  # Optional per-model context-window overrides in tokens, e.g.
  # my-gateway-alias: 200000
  context_windows: {}
# Optional organisation project reports (doc/features/23). Off by default;
# enabling it requires newapi.access_token/user_id and insights.enabled.
# Groups, projects and rules are managed in the admin UI, not here.
org_reports:
  enabled: false
  timezone: Asia/Shanghai
  week_start: monday
  idle_gap_seconds: 180

# Session analysis (doc/features/24-session-analysis.md): a daily batch of
# deterministic per-session signals, plus optional facets from a LOCAL model.
# Requires insights. The llm block only accepts loopback/private endpoints
# unless allow_non_local is set.
session_analysis:
  enabled: false
  run_at: "02:00"
  session_idle_minutes: 120
  l1_settle_hours: 24
  min_user_turns: 2
  min_active_seconds: 60
  vocabulary_file: ""
  pack:
    max_tokens: 6000
  llm:
    enabled: false
    base_url: http://127.0.0.1:11434/v1
    model: ""
    structured_output: json_schema
    context_tokens: 16384
    disable_thinking: true
    max_output_tokens: 600
    max_concurrency: 1
    timeout_seconds: 120
    max_sessions_per_run: 300

interceptors:
  require-client-credential:
    type: require_credential
  optional-body-limit:
    type: max_body_bytes
    config:
      max_bytes: 2097152

routes:
  - {id: openai-chat-completions, method: POST, path: /v1/chat/completions, match: exact, parser: openai.chat_completions, interceptors: [require-client-credential]}
  - {id: openai-completions, method: POST, path: /v1/completions, match: exact, parser: openai.completions, interceptors: [require-client-credential]}
  - {id: openai-responses, method: POST, path: /v1/responses, match: exact, parser: openai.responses, interceptors: [require-client-credential]}
  - {id: openai-responses-compact, method: POST, path: /v1/responses/compact, match: exact, parser: openai.responses_compact, interceptors: [require-client-credential]}
  - {id: anthropic-messages, method: POST, path: /v1/messages, match: exact, parser: anthropic.messages, interceptors: [require-client-credential]}
  - id: gemini-generate-content
    method: POST
    path: /v1beta/models/{model}:generateContent
    match: template
    parser: gemini.generate_content
    interceptors: [require-client-credential]
  - id: gemini-stream-generate-content
    method: POST
    path: /v1beta/models/{model}:streamGenerateContent
    match: template
    parser: gemini.stream_generate_content
    interceptors: [require-client-credential]
