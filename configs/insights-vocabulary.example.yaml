# Optional override for the context-insights vocabulary
# (doc/features/20-context-insights.md section 6 and 11).
# Point insights.vocabulary_file at a copy of this file. The built-in defaults
# stay in effect for everything you do not mention.
#
# Merge rules:
#   - maps (clients, tool_kinds, tool_kind_prefixes, spawn_tools, file_ops.tools)
#     merge by key; inside a client, scalars and maps merge and lists replace;
#   - lists (injection_markers, subagent_prefixes, side_requests, header lists)
#     replace the default list as a whole when present;
#   - header names, tool names and prefixes are case-insensitive;
#   - a client added here without `priority` gets 50: after the built-in
#     native clients, before the generic `custom` one (100).
# Unknown keys and unknown roles / tool kinds are rejected at startup.
#
# Roles: main, subagent, compaction, title, review, auxiliary.
# Tool kinds: file_read, file_write, search, shell, spawn, mcp, other.

clients:
  # Rename the generic custom-agent headers (defaults: X-Agent-Session-Id,
  # X-Agent-Id, X-Agent-Parent-Id, X-Agent-Role, X-Agent-Name) to the names your
  # framework already sends. Nothing else about the client needs repeating.
  # `label` (optional, at most 64 bytes) is the display name the UI shows in
  # place of the client key or its built-in name, everywhere including the
  # group_by=client table; the stored agent_client stays the key.
  custom:
    label: "My Framework"
    detect:
      headers_present: [x-myfw-agent, x-myfw-run]
    root_headers: [x-myfw-run]
    node_headers: [x-myfw-agent]
    parent_headers: [x-myfw-parent]
    name_headers: [x-myfw-label]
    role_headers:
      - header: x-myfw-kind
        values:
          planner: main
          worker: subagent
          summarizer: compaction

  # Give an in-house framework its own client instead of sharing `custom`, so
  # it gets its own column under group_by=client (deployment guide section
  # 6.4). It is detected by its User-Agent prefix (case-insensitive prefix
  # match: "MyAgent/1.2.0" and "myagent/2" both match) and reads the same
  # X-Agent-* headers as `custom`. Requests that miss X-Agent-Id still belong
  # to this client but fall back to content-inferred sessions. Drop the
  # headers_present line when other X-Agent-* senders should stay in `custom`.
  # my-agent:
  #   label: "My Agent"
  #   detect:
  #     user_agent_prefixes: ["MyAgent/"]
  #     headers_present: [x-agent-id]
  #   root_headers: [x-agent-session-id]
  #   node_headers: [x-agent-id]
  #   parent_headers: [x-agent-parent-id]
  #   name_headers: [x-agent-name]
  #   role_headers:
  #     - header: x-agent-role
  #       values:
  #         main: main
  #         subagent: subagent
  #         compaction: compaction
  #         title: title
  #         review: review
  #         auxiliary: auxiliary

  # Any other client can be added the same way; lower priority is tried first.
  # my_client:
  #   priority: 50
  #   detect:
  #     user_agent_prefixes: ["my-client/"]
  #   node_headers: [x-my-client-session]
  #   parent_headers: [x-my-client-parent]

# Replaces the default marker list. Text parts that start with one of these
# (after leading whitespace) in user/developer messages count as injected.
injection_markers:
  - "<system-reminder>"
  - "<environment_context>"
  - "<user_instructions>"
  - "<skill_content"
  - "# AGENTS.md"
  - "<user-prompt-submit-hook>"
  - "<my-framework-context>"

# Added to the default tool map (names are lower-cased).
tool_kinds:
  fetch_url: other
  run_tests: shell
  open_file: file_read

# Which argument of a spawn tool carries the child prompt.
spawn_tools:
  delegate: [task, prompt]

# Added to the default file-operation rules.
file_ops:
  tools:
    open_file: {op: read}
