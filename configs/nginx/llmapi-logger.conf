# This file is included by nginx.conf inside the http block.
# Only POST requests matching the exact LLM API whitelist use audit-proxy.
map "$request_method:$uri" $request_backend {
    default newapi_backend;

    ~^POST:/v1/chat/completions$  audit_proxy_backend;
    ~^POST:/v1/completions$       audit_proxy_backend;
    ~^POST:/v1/responses$         audit_proxy_backend;
    ~^POST:/v1/responses/compact$ audit_proxy_backend;
    ~^POST:/v1/messages$          audit_proxy_backend;

    ~^POST:/v1beta/models/[A-Za-z0-9._-]+:(?:generateContent|streamGenerateContent)$ audit_proxy_backend;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream audit_proxy_backend {
    server audit-proxy:8080;
    keepalive 16;
}

upstream newapi_backend {
    server newapi:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;

    location / {
        include /etc/nginx/conf.d/proxy-common.inc;

        # Deliberately has no URI suffix: preserve the original path and query.
        proxy_pass http://$request_backend;
    }
}
