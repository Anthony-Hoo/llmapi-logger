# This file is included by nginx.conf inside the http block.
# Send the complete NewAPI data plane through audit-proxy. Its in-process
# dispatcher audits configured LLM routes, transparently passes unrelated
# endpoints such as /v1/models, and fails closed for protected or unsafe path
# variants. Keeping this decision in one place prevents Nginx fallback rules
# from bypassing the LLM route boundary.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

upstream audit_proxy_backend {
    server audit-proxy:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512m;

    location / {
        include /etc/nginx/conf.d/proxy-common.inc;

        # Deliberately has no URI suffix: preserve the original path and query.
        proxy_pass http://audit_proxy_backend;
    }
}
