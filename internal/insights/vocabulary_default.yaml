# Default insights vocabulary (doc/features/20-context-insights.md section 5.8, 5.7, 6, 11).
# Compiled into the binary; an override file is merged on top (see
# configs/insights-vocabulary.example.yaml). Header names are matched
# case-insensitively. Role-header values are matched case-insensitively.

clients:
  codex:
    priority: 10
    # Project identity for org reports (doc 23): the body copy is canonical,
    # the header a compatibility projection.
    project_body_paths:
      - {path: client_metadata.x-codex-turn-metadata, kind: codex_turn_metadata}
    project_headers:
      - {header: x-codex-turn-metadata, kind: codex_turn_metadata}
    detect:
      user_agent_prefixes: ["codex_cli_rs/"]
      headers_present: [originator, x-codex-parent-thread-id, x-openai-subagent]
    root_headers: [session-id]
    node_headers: [thread-id]
    parent_headers: [x-codex-parent-thread-id]
    parent_body_paths: [client_metadata.x-codex-parent-thread-id]
    role_headers:
      - header: x-openai-subagent
        values:
          collab_spawn: subagent
          review: review
          compact: compaction
          memory_consolidation: auxiliary

  claude_code:
    priority: 20
    detect:
      user_agent_prefixes: ["claude-cli/"]
      headers_present: [x-claude-code-session-id, x-claude-code-agent-id]
      headers_equal:
        x-app: cli
    root_headers: [x-claude-code-session-id]
    node_headers: [x-claude-code-agent-id]
    parent_headers: [x-claude-code-parent-agent-id]
    node_fallback: root    # no agent-id header: the main agent, whose node is the session root
    parent_fallback: root  # agent-id present without a parent header: the parent is the main agent
    role_headers:
      - header: x-claude-code-request-class
        values:
          main: main
          subagent: subagent
          compaction: compaction
          auxiliary: auxiliary
          side_reply: auxiliary
          workflow: auxiliary

  opencode:
    priority: 30
    project_headers:
      - {header: x-opencode-project, kind: opencode_project}
    detect:
      user_agent_prefixes: ["opencode/"]
      headers_present: [x-opencode-client, x-opencode-session-id]
    node_headers: [x-opencode-session-id]
    parent_headers: [x-opencode-parent-session-id, x-parent-session-id]

  dsh:
    priority: 40
    project_body_paths:
      - {path: dsh_session_log.session.cwd, kind: cwd}
    detect:
      user_agent_prefixes: ["deepseek-harness/"]
      headers_present: [x-deepseek-harness-session-id]
    node_headers: [x-deepseek-harness-session-id]
    # deepseek-harness docs/deepseek-llm-api-wire-extensions.md: the session
    # block carries parentSession (with origin "subagent", delegationDepth,
    # cwd). header.parentSession is kept as a fallback for older builds that
    # may have put it there. The pi-ai adapter path sends no session headers
    # and falls back to content inference.
    parent_body_paths:
      - dsh_session_log.session.parentSession
      - dsh_session_log.header.parentSession
    role_headers:
      - header: x-deepseek-harness-compact
        values:
          "1": compaction

  # Z.ai ZCode (zai-org/ZCode, apps/zcode-cli/packages/adapters/src/model/
  # runner-attribution.ts). UA ZCode/<ver>, X-Title "Z Code@electron" or
  # "Z Code@cli". x-session-id is the session id with the sess_ /
  # subagent_agent_ prefix stripped, so a sub-agent has its own node id.
  # How a sub-agent names its parent is not verified, so there is no parent
  # rule: sub-agents link through content matching.
  zcode:
    priority: 42
    detect:
      user_agent_prefixes: ["ZCode/"]
      headers_present: [x-zcode-session-type]
    node_headers: [x-session-id]
    # The first matching role header wins: query source first, so a compact
    # request of a main session is a compaction. project_memory_* query
    # sources have no exact value to map and stay with the session type.
    role_headers:
      - header: x-zcode-query-source
        values:
          compact: compaction
          session_title: title
      - header: x-zcode-session-type
        values:
          main: main
          subagent: subagent
          side_chat: auxiliary
          other: auxiliary

  # pi (earendil-works/pi, formerly badlogic/pi-mono; packages/ai/src/utils/
  # identity.ts, packages/ai/src/api/openai-responses.ts). UA
  # "pi/<ver> (<platform>; <runtime>/<ver>; <arch>)". Only the OpenAI
  # Responses provider sends session-id (and x-client-request-id, the same
  # uuid) by default; Chat Completions and Anthropic send no session id. No
  # built-in sub-agents; compaction is the side_requests system prefix below.
  # Detected by User-Agent only: session-id is shared with Codex, and pi's
  # ChatGPT-backend provider also sends originator: pi, which the codex
  # header rule would otherwise claim.
  pi:
    priority: 45
    detect:
      user_agent_prefixes: ["pi/"]
    root_headers: [session-id]
    node_headers: [session-id]

  # Generic custom agent frameworks (doc section 11). Lowest priority: native
  # client headers win.
  custom:
    priority: 100
    detect:
      headers_present: [x-agent-id, x-agent-session-id]
    root_headers: [x-agent-session-id]
    node_headers: [x-agent-id]
    parent_headers: [x-agent-parent-id]
    name_headers: [x-agent-name]
    role_headers:
      - header: x-agent-role
        values:
          main: main
          subagent: subagent
          compaction: compaction
          title: title
          review: review
          auxiliary: auxiliary

# A text part that starts (after leading whitespace) with one of these markers,
# in a user or developer message, is counted as injected context.
injection_markers:
  - "<system-reminder>"
  - "<environment_context>"
  - "<user_instructions>"
  - "<skill_content"
  - "# AGENTS.md"
  - "<user-prompt-submit-hook>"

# System or message text starting with one of these prefixes changes on every
# request without the context really changing; item fingerprints use the
# prefix instead of the text so prefix matching keeps working.
volatile_text_prefixes:
  - "x-anthropic-billing-header:"

# Lower-cased tool name -> tool kind (file_read, file_write, search, shell,
# spawn, mcp, other).
tool_kinds:
  read: file_read
  read_file: file_read
  write: file_write
  edit: file_write
  multiedit: file_write
  notebookedit: file_write
  apply_patch: file_write
  str_replace_editor: file_write
  str_replace_based_edit_tool: file_write
  grep: search
  glob: search
  bash: shell
  shell: shell
  exec_command: shell
  agent: spawn
  task: spawn
  spawn_agent: spawn
  subagent: spawn
  subagent_fork: spawn

# Lower-cased tool name prefix -> tool kind.
tool_kind_prefixes:
  "mcp__": mcp

# Lower-cased spawn tool name -> argument names that carry the child prompt,
# in priority order.
spawn_tools:
  agent: [prompt]
  task: [prompt]
  spawn_agent: [message, prompt]
  subagent: [prompt, message]
  subagent_fork: [prompt, message]

# Fixed text some clients put in front of a child agent's opening prompt.
subagent_prefixes:
  - "You are a subagent spawned by another session.\n"

# Requests that are not agent work: recognised from the request body. A
# system prefix matches the first system text after leading whitespace is
# trimmed, case-sensitively; last_user_contains is a substring of the last
# user text.
side_requests:
  - role: title
    system_prefixes: ["You are a title generator"]
  - role: compaction
    last_user_contains: ["You MUST use this format for your response"]
  # pi-ai / pi-coding-agent automatic compaction: a fixed system prompt that
  # asks the model to summarise the conversation so far.
  - role: compaction
    system_prefixes: ["You are a context summarization assistant."]

# User-role text parts that a client injected rather than a person typed
# (doc/features/24-session-analysis.md section 6.3). Leading whitespace is
# trimmed and the first 64 characters are compared case-insensitively. The
# conversation view's user-input outline uses the same list; keep them equal.
user_input_exclude_prefixes:
  - "<environment_context"
  - "<user_instructions"
  - "<system-reminder"
  - "<permissions"
  - "<skill"
  - "<user-prompt-submit-hook"
  - "<turn_aborted"
  - "# agents.md"

file_ops:
  path_keys: [file_path, filePath, path, notebook_path]
  old_keys: [old_string, old_str]
  new_keys: [new_string, new_str, new_source, insert_text]
  content_keys: [content, file_text]
  edits_keys: [edits]
  patch_keys: [input, patch, diff, command]
  tools:
    read: {op: read}
    read_file: {op: read}
    write: {op: write, style: write}
    edit: {op: write, style: edit}
    multiedit: {op: write, style: multi_edit}
    notebookedit: {op: write, style: edit}
    apply_patch: {op: write, style: patch}
    str_replace_editor: {op: write, style: editor}
    str_replace_based_edit_tool: {op: write, style: editor}
    grep: {op: search}
    glob: {op: search}
    bash: {op: shell}
    shell: {op: shell}
    exec_command: {op: shell}

# Project identity signals read from every request, whatever its client
# (doc/features/23-org-project-reports.md section 5.1). Only the optional
# organisation reports read them. Text patterns run over system, developer and
# user text of the first and last messages; the first non-empty capture group
# is the value and a later match replaces an earlier one (environment update).
project:
  headers:
    - {header: x-agent-project, kind: declared}
  text_patterns:
    # Codex <environment_context> and pi >= 0.86 system prompt.
    - kind: cwd
      pattern: '(?s)<cwd>\s*([^<\r\n]+?)\s*</cwd>'
    # Claude Code and ZCode environment block, including "# Environment
    # update" lines of the form "<new> (was <old>)".
    - kind: cwd
      pattern: '(?m)^[ \t]*-[ \t]*Primary working directory:[ \t]*(\S[^\r\n]*?)(?:[ \t]+\(was [^\r\n]*\))?[ \t]*\r?$'
    # Claude Code project instructions file in the repository root.
    - kind: root_file
      pattern: 'Contents of ([^\r\n]+?[\\/]CLAUDE\.md) \(project instructions'
    # OpenCode <env> block (v2 adds the git top level).
    - kind: root
      pattern: '(?m)^[ \t]*Workspace root folder:[ \t]*(\S[^\r\n]*?)[ \t]*\r?$'
    - kind: cwd
      pattern: '(?m)^[ \t]*Working directory:[ \t]*(\S[^\r\n]*?)[ \t]*\r?$'
    # pi project instructions file.
    - kind: root_file
      pattern: '<project_instructions path="([^"\r\n]+)"'
    # pi before 0.86 and dsh: quoted (dsh) or bare (pi) path.
    - kind: cwd
      pattern: '(?m)Current working directory:[ \t]*(?:"([^"\r\n]+)"|([^"\s][^\r\n]*?))[ \t]*\.?[ \t]*\r?$'